# SplitTrust laboratory. The lab's own DNS (private root, parent zones, PvD
# server, quad9.lab) lives on the isolated network "splitlab". The resolvers of
# the office and the hotel, the devices (app, proxy) and the test runner also
# join "egress" so the real-domain scenarios can validate against the real DNS.
# The only published port is the console on 127.0.0.1:8000.
#
#   docker compose -f lab/compose.yaml up --build -d
#   docker compose -f lab/compose.yaml exec app splittrust verify --scenario hotel-forged
#   docker compose -f lab/compose.yaml --profile tools run --rm test
#   docker compose -f lab/compose.yaml down -v
name: splittrust

x-labgen: &labgen
  volumes:
    - labgen:/gen:ro

services:
  bootstrap:
    build:
      context: ..
      dockerfile: lab/bind/Dockerfile
      target: bootstrap
    volumes:
      - labgen:/gen
    network_mode: none

  public-dns:
    build:
      context: ..
      dockerfile: lab/bind/Dockerfile
      target: bind
    command: ["named", "-g", "-c", "/gen/public-dns/named.conf", "-u", "bind"]
    <<: *labgen
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks:
      splitlab:
        ipv4_address: 172.30.97.10

  local-dot:
    image: coredns/coredns:1.12.0
    command: ["-conf", "/gen/local-dot/Corefile"]
    <<: *labgen
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks:
      splitlab:
        ipv4_address: 172.30.97.20
      egress: {}

  hotel-dot:
    image: coredns/coredns:1.12.0
    command: ["-conf", "/gen/hotel-dot/Corefile"]
    <<: *labgen
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks:
      splitlab:
        ipv4_address: 172.30.97.21
      egress: {}

  pvd:
    image: nginx:1.27-alpine
    command: ["nginx", "-g", "daemon off;", "-c", "/gen/pvd/nginx.conf"]
    <<: *labgen
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks:
      splitlab:
        ipv4_address: 172.30.97.30

  external:
    build:
      context: ./external
    <<: *labgen
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks:
      splitlab:
        ipv4_address: 172.30.97.40

  app:
    build:
      context: ..
      dockerfile: lab/app/Dockerfile
    command: ["serve", "--addr", "0.0.0.0:8000"]
    environment:
      SPLITTRUST_PROXY: http://172.30.97.60:8001
      SPLITTRUST_PROXY_DNS: 172.30.97.60:53
      SPLITTRUST_NAIVE_DNS: 172.30.97.21:53
    <<: *labgen
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts: &pvdhosts
      - "pvd.corp.lab:172.30.97.30"
      - "pvd.hotel.lab:172.30.97.30"
      - "replay.hotel.lab:172.30.97.30"
      - "wifi.hotel.lab:172.30.97.30"
      - "wifi-replay.hotel.lab:172.30.97.30"
      - "pvd.splittrust.zivkovic.me:172.30.97.30"
      - "pvd.stale.lab:172.30.97.30"
      - "pvd.expired.lab:172.30.97.30"
      - "pvd.unsigned.lab:172.30.97.30"
      - "pvd.wrongds.lab:172.30.97.30"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      public-dns:
        condition: service_started
      local-dot:
        condition: service_started
      hotel-dot:
        condition: service_started
      pvd:
        condition: service_started
      external:
        condition: service_started
    networks:
      splitlab:
        ipv4_address: 172.30.97.50
      egress: {}

  # The DNS front door: ordinary stubs point here. Starts on the company network;
  # the console (or POST /join on :8001) moves it to another network.
  proxy:
    build:
      context: ..
      dockerfile: lab/app/Dockerfile
    command: ["proxy", "--scenario", "legit", "--listen", "0.0.0.0:53", "--control", "0.0.0.0:8001"]
    <<: *labgen
    extra_hosts: *pvdhosts
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      public-dns:
        condition: service_started
      local-dot:
        condition: service_started
      hotel-dot:
        condition: service_started
      pvd:
        condition: service_started
      external:
        condition: service_started
    networks:
      splitlab:
        ipv4_address: 172.30.97.60
      egress: {}

  # A plain client with no SplitTrust code: its DNS server is the proxy.
  #   docker compose -f lab/compose.yaml exec client curl -s http://host.internal.corp.lab
  client:
    build:
      context: ./client
    dns: [172.30.97.60]
    depends_on:
      proxy:
        condition: service_started
    networks:
      splitlab:
        ipv4_address: 172.30.97.61

  # The same client on the hotel Wi-Fi without SplitTrust: DNS straight from the hotel.
  naive:
    build:
      context: ./client
    dns: [172.30.97.21]
    depends_on:
      hotel-dot:
        condition: service_started
    networks:
      splitlab:
        ipv4_address: 172.30.97.62

  # Web servers behind the names in play: the company intranet host, the real bank, the hotel's fake bank.
  intranet:
    build:
      context: ./web
    environment:
      SITE_BANNER: "INTRANET (172.30.97.70): company SecureCompany's internal host. Reached through the resolver the domain owner authorised."
    networks:
      splitlab:
        ipv4_address: 172.30.97.70

  unsecure-intranet:
    build:
      context: ./web
    environment:
      SITE_BANNER: "intranet.unsecure.example (172.30.97.71): company UnsecureCompany's intranet. UnsecureCompany never adopted RFC 9704; its devices trust whatever resolver the network hands them."
    networks:
      splitlab:
        ipv4_address: 172.30.97.71

  bank:
    build:
      context: ./web
    environment:
      SITE_BANNER: "www.banka.lab (172.30.97.80): the real bank."
    networks:
      splitlab:
        ipv4_address: 172.30.97.80

  fake-bank:
    build:
      context: ./web
    environment:
      SITE_BANNER: "FAKE PAGE (172.30.97.66): a copy of the site you asked for, served by the hotel resolver. A real attacker would collect your login here."
    networks:
      splitlab:
        ipv4_address: 172.30.97.66

  test:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: lab/app/Dockerfile
      target: builder
    working_dir: /src
    command: ["go", "test", "-count=1", "-tags", "integration libunbound", "./tests/..."]
    environment:
      SPLITTRUST_MANIFEST: /gen/client/manifest.json
    <<: *labgen
    extra_hosts: *pvdhosts
    depends_on:
      app:
        condition: service_started
    networks:
      splitlab:
        ipv4_address: 172.30.97.51
      egress: {}

volumes:
  labgen: {}

networks:
  splitlab:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.97.0/24
  # Ordinary bridge with Internet access, for the parts that have it in real
  # life: the office and hotel resolvers, the devices (app, proxy) and the test
  # runner. The lab's own zones never leave splitlab.
  egress:
    driver: bridge
