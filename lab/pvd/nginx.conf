# PvD Additional Information server (RFC 8801 section 4.1): one certificate with
# every PvD ID as a SAN, documents selected by the Host header. Complete nginx
# configuration (loaded with -c from the generated volume).
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 443 ssl;
        server_name pvd.corp.lab pvd.hotel.lab replay.hotel.lab pvd.stale.lab pvd.expired.lab pvd.unsigned.lab pvd.wrongds.lab;
        ssl_certificate     /gen/pvd/cert.pem;
        ssl_certificate_key /gen/pvd/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /gen/pvd/docs;
        location = /.well-known/pvd {
            types { application/pvd+json json; }
            default_type application/pvd+json;
            try_files /$host.json =404;
        }
        location / { return 404; }
    }
}
